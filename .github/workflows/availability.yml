name: Update availability

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: availability

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch booked dates from Airbnb
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python3 .github/scripts/availability.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- availability.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git commit -m "Update availability from Airbnb"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
